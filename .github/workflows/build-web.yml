yaml
name: Build GOD HAND WEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo com submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -eu

          test -f CMakeLists.txt || {
            echo "ERRO: CMakeLists.txt nao encontrado na raiz."
            exit 1
          }

          test -f js/play_browser/package.json || {
            echo "ERRO: package.json da interface React nao encontrado."
            exit 1
          }

          echo "Arquivos do projeto encontrados."

      - name: Configurar compilacao
        shell: bash
        run: |
          set -eu

          emcmake cmake -S . -B build_cmake/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_PLAY=ON \
            -DBUILD_PSFPLAYER=ON \
            -DUSE_QT=OFF

      - name: Corrigir opcao antiga do Emscripten
        shell: bash
        run: |
          set -eu

          if [ -d build_cmake/build ]; then
            grep -RIl \
              --include='*.cmake' \
              --include='*.make' \
              --include='build.ninja' \
              --include='link.txt' \
              -- '-sUSE_ES6_IMPORT_META=0' \
              build_cmake/build 2>/dev/null |
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              sed -i 's/-sUSE_ES6_IMPORT_META=0//g' "$file"
            done || true
          fi

          echo "Verificacao concluida."

      - name: Compilar emulador
        shell: bash
        run: |
          set -eu

          cmake --build build_cmake/build \
            --config Release \
            --parallel 2

      - name: Localizar arquivos compilados
        shell: bash
        run: |
          set -eu

          echo "Procurando Play.js e Play.wasm..."

          find build_cmake/build -type f \
            \( -name 'Play.js' -o -name 'Play.wasm' \) \
            -print

          JS_FILE="$(find build_cmake/build -type f -name 'Play.js' -print -quit)"
          WASM_FILE="$(find build_cmake/build -type f -name 'Play.wasm' -print -quit)"

          if [ -z "$JS_FILE" ]; then
            echo "ERRO: Play.js nao foi gerado."
            exit 1
          fi

          if [ -z "$WASM_FILE" ]; then
            echo "ERRO: Play.wasm nao foi gerado."
            exit 1
          fi

          echo "PLAY_JS=$JS_FILE" >> "$GITHUB_ENV"
          echo "PLAY_WASM=$WASM_FILE" >> "$GITHUB_ENV"

      - name: Preparar arquivos do emulador
        shell: bash
        run: |
          set -eu

          mkdir -p js/play_browser/src
          mkdir -p js/play_browser/public

          cp "$PLAY_JS" js/play_browser/src/Play.js
          cp "$PLAY_WASM" js/play_browser/src/Play.wasm

          cp "$PLAY_JS" js/play_browser/public/Play.js
          cp "$PLAY_WASM" js/play_browser/public/Play.wasm

          test -s js/play_browser/src/Play.js
          test -s js/play_browser/src/Play.wasm
          test -s js/play_browser/public/Play.js
          test -s js/play_browser/public/Play.wasm

          echo "Arquivos preparados."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/play_browser/package-lock.json

      - name: Instalar dependencias React
        working-directory: js/play_browser
        run: npm install

      - name: Compilar interface React
        working-directory: js/play_browser
        run: npm run build

      - name: Verificar e preparar site final
        shell: bash
        run: |
          set -eu

          test -s js/play_browser/build/index.html || {
            echo "ERRO: index.html nao foi gerado."
            exit 1
          }

          cp js/play_browser/public/Play.js \
            js/play_browser/build/Play.js

          cp js/play_browser/public/Play.wasm \
            js/play_browser/build/Play.wasm

          test -s js/play_browser/build/Play.js
          test -s js/play_browser/build/Play.wasm
          test -s js/play_browser/build/index.html

          echo "Site final preparado."

      - name: Guardar site compilado
        uses: actions/upload-artifact@v4
        with:
          name: god-hand-web-site
          path: js/play_browser/build/
          if-no-files-found: error
          retention-days: 7

