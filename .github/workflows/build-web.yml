
name: Build GOD HAND WEB

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo com submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.64

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -eu
          test -f CMakeLists.txt
          test -f js/play_browser/package.json

      - name: Configurar compilacao
        shell: bash
        run: |
          emcmake cmake -S . -B build_cmake/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_PLAY=ON \
            -DBUILD_PSFPLAYER=ON \
            -DUSE_QT=OFF

      - name: Compilar emulador
        shell: bash
        run: |
          cmake --build build_cmake/build --config Release --parallel 2

      - name: Localizar arquivos compilados
        shell: bash
        run: |
          set -eu
          JS_FILE="$(find build_cmake/build -type f -name 'Play.js' -print -quit)"
          WASM_FILE="$(find build_cmake/build -type f -name 'Play.wasm' -print -quit)"

          test -n "$JS_FILE" || { echo "Play.js nao foi gerado"; exit 1; }
          test -n "$WASM_FILE" || { echo "Play.wasm nao foi gerado"; exit 1; }

          echo "PLAY_JS=$JS_FILE" >> "$GITHUB_ENV"
          echo "PLAY_WASM=$WASM_FILE" >> "$GITHUB_ENV"

      - name: Preparar arquivos do emulador
        shell: bash
        run: |
          set -eu
          mkdir -p js/play_browser/src js/play_browser/public

          cp "$PLAY_JS" js/play_browser/src/Play.js
          cp "$PLAY_WASM" js/play_browser/src/Play.wasm
          cp "$PLAY_JS" js/play_browser/public/Play.js
          cp "$PLAY_WASM" js/play_browser/public/Play.wasm

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/play_browser/package-lock.json

      - name: Instalar dependencias React
        working-directory: js/play_browser
        run: npm install

      - name: Compilar interface React
        working-directory: js/play_browser
        env:
          PUBLIC_URL: /Play-
        run: npm run build

      - name: Verificar site final
        shell: bash
        run: |
          set -eu
          test -s js/play_browser/build/index.html
          cp js/play_browser/public/Play.js js/play_browser/build/Play.js
          cp js/play_browser/public/Play.wasm js/play_browser/build/Play.wasm

      - name: Guardar site compilado
        uses: actions/upload-artifact@v4
        with:
          name: god-hand-web-site
          path: js/play_browser/build/
          if-no-files-found: error
          retention-days: 7

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: js/play_browser/build/

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GOD HAND WEB
        id: deployment
        uses: actions/deploy-pages@v4
