
      - name: Corrigir opcao antiga do Emscripten
        shell: bash
        run: |
          set -eu

          if [ -d build_cmake/build ]; then
            grep -RIl \
              --include='*.cmake' \
              --include='*.make' \
              --include='build.ninja' \
              --include='link.txt' \
              -- '-sUSE_ES6_IMPORT_META=0' \
              build_cmake/build 2>/dev/null \
              | while IFS= read -r file; do
                  [ -n "$file" ] || continue
                  sed -i 's/-sUSE_ES6_IMPORT_META=0//g' "$file"
                done || true
          fi

          echo "Verificacao da opcao antiga concluida."
