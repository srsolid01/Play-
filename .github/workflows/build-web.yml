
name: Build GOD HAND WEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo com submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Configurar compilacao
        run: |
          emcmake cmake -S . -B build_cmake/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_PLAY=ON \
            -DBUILD_PSFPLAYER=ON \
            -DUSE_QT=OFF

      - name: Corrigir opcao antiga do Emscripten
        run: |
          grep -RIl -- '-sUSE_ES6_IMPORT_META=0' build_cmake/build \
            | xargs -r sed -i 's/-sUSE_ES6_IMPORT_META=0//g'

      - name: Compilar emulador
        run: |
          cmake --build build_cmake/build \
            --config Release --parallel 2

      - name: Preparar arquivos do emulador
        run: |
          mkdir -p js/play_browser/public

          cp build_cmake/build/Source/ui_js/Play.js \
            js/play_browser/src/Play.js

          cp build_cmake/build/Source/ui_js/Play.js \
            js/play_browser/public/Play.js

          cp build_cmake/build/Source/ui_js/Play.wasm \
            js/play_browser/public/Play.wasm

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/play_browser/package-lock.json

      - name: Instalar dependencias React
        working-directory: js/play_browser
        run: npm install

      - name: Compilar interface React
        working-directory: js/play_browser
        run: npm run build

      - name: Incluir arquivos do emulador no site
        run: |
          cp js/play_browser/public/Play.js \
            js/play_browser/build/Play.js

          cp js/play_browser/public/Play.wasm \
            js/play_browser/build/Play.wasm

          test -s js/play_browser/build/index.html
          test -s js/play_browser/build/Play.js
          test -s js/play_browser/build/Play.wasm

      - name: Guardar site compilado
        uses: actions/upload-artifact@v4
        with:
          name: god-hand-web-site
          path: js/play_browser/build/
          if-no-files-found: error
